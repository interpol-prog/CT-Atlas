name = "ct-report-generator"
main = "index.js"
compatibility_date = "2026-09-02"
compatibility_flags = []

[vars]
EVENTS_URL = "https://interpol-prog.github.io/CT-Atlas/events.json"
GEMINI_MODEL = "gemini-3.5-flash-lite"
ALLOWED_ORIGIN = "https://ct-atlas.com"

[[durable_objects.bindings]]
name = "REPORT_GATE"
class_name = "ReportGate"

[exports.ReportGate]
type = "durable-object"
storage = "sqlite"
