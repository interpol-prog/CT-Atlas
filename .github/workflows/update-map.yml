name: Daily CT Intelligence Map Update

on:

  schedule:
    - cron: "17 6 * * *"
      timezone: "Europe/Paris"

  workflow_dispatch:

  push:
    branches:
      - main


permissions:
  contents: write
  pages: write
  id-token: write


concurrency:
  group: ct-map-update-main
  cancel-in-progress: true


jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Collect latest CT events
        run: |
          python collector.py


      - name: Geolocate events
        run: |
          python geolocate.py


      - name: Commit and push updated database
        run: |
          git config user.name "CT Intelligence Map Bot"
          git config user.email "actions@github.com"

          git add events.json

          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Daily CT intelligence update"

            git fetch origin main

            git rebase origin/main

            git push origin main
          fi


  deploy:

    needs: update

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout updated repository
        uses: actions/checkout@v6
        with:
          ref: main


      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."


      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
