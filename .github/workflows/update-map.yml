name: Daily CT Intelligence Map Update

on:

  schedule:
    - cron: "17 6 * * *"
      timezone: "Europe/Paris"

  workflow_dispatch:
    inputs:

      mode:
        description: "Collection mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - backfill

      force_ai:
        description: "Re-run AI geolocation for every existing event"
        required: true
        default: false
        type: boolean

  push:
    branches:
      - main


permissions:
  contents: write
  pages: write
  id-token: write


concurrency:
  group: ct-map-update-main
  cancel-in-progress: true


jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Collect CT events
        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.mode }}" = "backfill" ]; then

            echo "Running 180-day backfill."
            python -u collector.py backfill

          else

            echo "Running daily collection."
            python -u collector.py

          fi


      - name: Gemini AI-first resilient geolocation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_GEO_MODEL: "gemini-3.5-flash-lite"
          GEMINI_RESCUE_MODEL: "gemini-3.6-flash"
          AI_GEO_BATCH_SIZE: "20"
        run: |

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY GitHub secret is missing."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.force_ai }}" = "true" ]; then

            echo "Forcing Gemini geolocation refresh for all events."
            AI_GEO_FORCE=1 python -u geolocate.py

          else

            echo "Using cached Gemini geolocation for unchanged events."
            python -u geolocate.py

          fi


      - name: Commit and push updated database
        run: |
          git config user.name "CT Intelligence Map Bot"
          git config user.email "actions@github.com"

          git add events.json

          if git diff --cached --quiet; then

            echo "No database changes to commit."

          else

            git commit -m "Update CT intelligence map"

            git fetch origin main
            git rebase origin/main
            git push origin main

          fi


  deploy:

    needs: update

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout updated repository
        uses: actions/checkout@v6
        with:
          ref: main


      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."


      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
