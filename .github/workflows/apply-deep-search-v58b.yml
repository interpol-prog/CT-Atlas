name: Apply Deep Search v5.8 corrected
on:
  push:
    paths:
      - '.github/workflows/apply-deep-search-v58b.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Normalize modular backend anchor
        shell: python
        run: |
          from pathlib import Path
          p=Path('cloudflare-worker/deep-search.js')
          s=p.read_text(encoding='utf-8')
          needle='''  for (const language of DEEP_SEARCH_LANGUAGE_CODES) {\n    const index = ranked.findIndex((row, i) => !used.has(i) && row.language === language);'''
          replacement='''  // Preserve multilingual evidence when it exists: take the best hit from each\n  // searched language first, then fill the remaining slots by overall relevance.\n  for (const language of DEEP_SEARCH_LANGUAGE_CODES) {\n    const index = ranked.findIndex((row, i) => !used.has(i) && row.language === language);'''
          if needle not in s:
              raise SystemExit('Expected buildEvidence loop not found')
          p.write_text(s.replace(needle,replacement,1),encoding='utf-8')
      - name: Apply patch
        run: python tools/patch_deep_search_v58.py
      - name: Validate JavaScript
        run: |
          node --check cloudflare-worker/deep-search.js
          node --check cloudflare-worker/index.js
          node --check deep-search.js
          grep -q 'deep-search-v5.8-priority-language' cloudflare-worker/deep-search.js
          grep -q 'detectPriorityLanguages' cloudflare-worker/deep-search.js
          grep -q 'max_search_requests: 36' cloudflare-worker/deep-search.js
          grep -q 'version: "5.8"' cloudflare-worker/index.js
          grep -q 'z-index:2147483000' deep-search.js
          ! grep -q 'z-index:-9999' deep-search.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker/deep-search.js cloudflare-worker/index.js deep-search.js
          git diff --cached --quiet || git commit -m "Prioritize local languages and fix Deep Search PDF"
          git push
