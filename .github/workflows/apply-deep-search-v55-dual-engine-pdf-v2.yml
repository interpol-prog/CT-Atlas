name: Apply Deep Search dual engine and PDF download v2

on:
  push:
    paths:
      - '.github/workflows/apply-deep-search-v55-dual-engine-pdf-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Execute corrected migration script
        shell: python
        run: |
          from pathlib import Path

          wf = Path('.github/workflows/apply-deep-search-v55-dual-engine-pdf.yml').read_text(encoding='utf-8')
          marker = '      - name: Upgrade Deep Search backend and PDF export\n'
          start = wf.index(marker)
          run_marker = '        run: |\n'
          run_start = wf.index(run_marker, start) + len(run_marker)
          run_end = wf.index('\n      - name: Validate JavaScript', run_start)
          block = wf[run_start:run_end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines)
          script = script.replace(
              "gdelt_retrieval + '\\n\\nfunction candidateMapEvents', s, count=1, flags=re.S)",
              "lambda _: gdelt_retrieval + '\\n\\nfunction candidateMapEvents', s, count=1, flags=re.S)"
          )
          script = script.replace(
              "pdf_code + '\\n          document.addEventListener', f, count=1, flags=re.S)",
              "lambda _: pdf_code + '\\n          document.addEventListener', f, count=1, flags=re.S)"
          )
          exec(compile(script, '<deep-search-v55-migration>', 'exec'), {})

      - name: Validate JavaScript
        run: |
          node --check cloudflare-worker/deep-search.js
          node --check cloudflare-worker/index.js
          node --check deep-search.js
          grep -q 'deep-search-v5.5-dual-engine-gdelt' cloudflare-worker/deep-search.js
          grep -q 'GDELT_DOC_URL' cloudflare-worker/deep-search.js
          grep -q 'DOWNLOAD PDF' deep-search.js
          grep -q 'html2pdf.bundle.min.js' deep-search.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker/deep-search.js cloudflare-worker/index.js deep-search.js
          git diff --cached --quiet || git commit -m "Add GDELT multilingual rescue and PDF download"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
