name: Repair Deep Search v5.5 migration

on:
  push:
    paths:
      - '.github/workflows/repair-deep-search-v55-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair regex replacement handling
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/apply-deep-search-v55-dual-engine-pdf.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "gdelt_retrieval + '\\n\\nfunction candidateMapEvents', s, count=1, flags=re.S)",
              "lambda _: gdelt_retrieval + '\\n\\nfunction candidateMapEvents', s, count=1, flags=re.S)"
          )
          s = s.replace(
              "pdf_code + '\\n          document.addEventListener', f, count=1, flags=re.S)",
              "lambda _: pdf_code + '\\n          document.addEventListener', f, count=1, flags=re.S)"
          )
          p.write_text(s, encoding='utf-8')
      - name: Commit repaired migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-deep-search-v55-dual-engine-pdf.yml
          git diff --cached --quiet || git commit -m "Repair Deep Search v5.5 migration script"
          git push
