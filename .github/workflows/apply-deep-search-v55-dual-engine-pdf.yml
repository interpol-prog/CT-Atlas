name: Apply Deep Search dual engine and PDF download

on:
  push:
    paths:
      - '.github/workflows/apply-deep-search-v55-dual-engine-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Upgrade Deep Search backend and PDF export
        shell: python
        run: |
          from pathlib import Path
          import re

          # ---------------- Backend ----------------
          path = Path('cloudflare-worker/deep-search.js')
          s = path.read_text(encoding='utf-8')

          s, n = re.subn(
              r'export const DEEP_SEARCH_VERSION = "[^"]+";\nconst SEARCH_FALLBACK_LOCALE = Object\.freeze\(\{[^\n]+\}\);',
              '''export const DEEP_SEARCH_VERSION = "deep-search-v5.5-dual-engine-gdelt";
          const GDELT_DOC_URL = "https://api.gdeltproject.org/api/v2/doc/doc";
          const GDELT_RESULTS_PER_LANGUAGE = 25;
          const GDELT_LANGUAGE_FILTERS = Object.freeze({
            en: "english", fr: "french", ar: "arabic", de: "german",
            es: "spanish", it: "italian", tr: "turkish", ru: "russian",
            fa: "persian", ur: "urdu", he: "hebrew", ps: "pashto"
          });''',
              s, count=1
          )
          if n != 1:
              raise SystemExit('Deep Search version/constants anchor not found')

          new_schema = '''const PLAN_SCHEMA = {
            type: "object",
            properties: {
              interpreted_request: { type: "string" },
              gdelt_query: { type: "string" },
              queries: {
                type: "object",
                properties: Object.fromEntries(
                  DEEP_SEARCH_LANGUAGE_CODES.map(code => [code, {
                    type: "object",
                    properties: {
                      primary: { type: "string" },
                      secondary: { type: "string" }
                    },
                    required: ["primary", "secondary"]
                  }])
                ),
                required: [...DEEP_SEARCH_LANGUAGE_CODES]
              }
            },
            required: ["interpreted_request", "gdelt_query", "queries"]
          };'''
          s, n = re.subn(r'const PLAN_SCHEMA = \{.*?\n\};\n\nconst REPORT_SCHEMA', new_schema + '\n\nconst REPORT_SCHEMA', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('PLAN_SCHEMA replacement failed')

          new_instruction = '''const PLAN_INSTRUCTION = `
          You are the query-planning component of CT Atlas Deep Search, an authorised
          multilingual OSINT research tool.

          Interpret the analyst's exact free-text request and create EXACTLY TWO concise
          Google News search queries in EACH of the 12 CT Atlas search languages (24 planned
          native-language queries total). Every Deep Search must search ALL 12 languages.

          Also create one concise English field named "gdelt_query" for GDELT's translated
          news index. It must preserve the analyst's exact scope, silently correct obvious
          spelling errors, and use compact English terms or phrases. It may use quotes and OR
          blocks. Do NOT include a sourcelang operator because the application adds that for
          each target language. This is a rescue layer for languages where Google News is
          sparse, not a replacement for the 12 native-language searches.

          MANDATORY 12-LANGUAGE COVERAGE:
          - en: English
          - fr: French
          - ar: Arabic
          - de: German
          - es: Spanish
          - it: Italian
          - tr: Turkish
          - ru: Russian
          - fa: Dari / Persian
          - ur: Urdu
          - he: Hebrew
          - ps: Pashto

          QUERY DESIGN RULES:
          - Silently correct obvious spelling mistakes in the analyst request before making
            search terms.
          - NEVER turn the analyst's whole request into one long sentence-like query.
          - Each native query should normally contain about 3-8 meaningful search terms or
            short phrases, plus the requested geography or actor where needed.
          - Use OR between genuine alternatives; do not require every requested facet to be
            present in the same article.
          - primary = broad/core subject; secondary = a complementary facet or evidence type.
          - For multi-part requests, DISTRIBUTE facets across primary and secondary.
          - Preserve precise geography and named actors. Adjacent countries are acceptable
            only for directly relevant routes, networks, seizures or cross-border operations.
          - Keep the same information need in all 12 languages using natural local terms.

          For narcotics research, split complex requests sensibly: cultivation/production/
          laboratories can be separated from trafficking/routes/networks/seizures/decrees/
          enforcement. Search narcotics or other adjacent security topics directly even when
          the analyst did not state a terrorism nexus.

          Return only the structured search plan. Return "gdelt_query" plus, for every
          language key, "primary" and "secondary". Do not answer the analyst's question yet.
          `;'''
          s, n = re.subn(r'const PLAN_INSTRUCTION = `.*?`;\n\nconst REPORT_INSTRUCTION', new_instruction + '\n\nconst REPORT_INSTRUCTION', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('PLAN_INSTRUCTION replacement failed')

          s = s.replace(
              'search_query: queryMeta.query,\n      fallback_locale: Boolean(fallbackLocale)',
              'search_query: queryMeta.query,\n      search_engine: "google_news",\n      fallback_locale: Boolean(fallbackLocale)'
          )
          s = s.replace(
              'if (normalized && normalized === candidate._normalized) { match = candidate; break; }',
              'if (row.url && candidate.url && row.url === candidate.url) { match = candidate; break; }\n      if (normalized && normalized === candidate._normalized) { match = candidate; break; }'
          )
          s = s.replace(
              'sources: [{ source: row.source, url: row.url, language: row.language, published: row.published }]',
              'sources: [{ source: row.source, url: row.url, language: row.language, published: row.published, search_engine: row.search_engine || "google_news" }]'
          )
          s = s.replace(
              'match.sources.push({ source: row.source, url: row.url, language: row.language, published: row.published });',
              'match.sources.push({ source: row.source, url: row.url, language: row.language, published: row.published, search_engine: row.search_engine || "google_news" });'
          )

          new_sanitize = '''function sanitizePlan(plan, fallbackQuestion) {
            const queries = [];
            const raw = plan?.queries && typeof plan.queries === "object" && !Array.isArray(plan.queries)
              ? plan.queries
              : {};

            const missing = [];
            for (const language of DEEP_SEARCH_LANGUAGE_CODES) {
              const item = raw[language];
              const primary = cleanText(item?.primary, 220);
              const secondary = cleanText(item?.secondary, 220);
              if (!primary || !secondary) {
                missing.push(language);
                continue;
              }
              queries.push({ language, query: primary, variant: "primary" });
              queries.push({ language, query: secondary, variant: "secondary" });
            }

            if (missing.length) {
              throw new Error(
                "Deep Search planner did not return two usable queries for every required language: " +
                missing.join(", ")
              );
            }

            const gdeltQuery = cleanText(plan?.gdelt_query, 280);
            if (!gdeltQuery) throw new Error("Deep Search planner did not return the required GDELT rescue query.");

            return {
              interpreted_request: cleanText(plan?.interpreted_request || fallbackQuestion, 700),
              gdelt_query: gdeltQuery,
              queries: queries.slice(0, DEEP_SEARCH_MAX_QUERIES)
            };
          }'''
          s, n = re.subn(r'function sanitizePlan\(plan, fallbackQuestion\) \{.*?\n\}\n\nasync function fetchNewsWave', new_sanitize + '\n\nasync function fetchNewsWave', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('sanitizePlan replacement failed')

          gdelt_retrieval = '''function gdeltUrl(query, language, periodDays) {
            const lang = GDELT_LANGUAGE_FILTERS[language] || language;
            const timespan = periodDays >= 365 ? "1y" : `${periodDays}d`;
            return GDELT_DOC_URL + "?" + new URLSearchParams({
              query: `${cleanText(query, 280)} sourcelang:${lang}`,
              mode: "artlist",
              format: "json",
              maxrecords: String(GDELT_RESULTS_PER_LANGUAGE),
              timespan
            }).toString();
          }

          function parseGdeltDate(value) {
            const raw = String(value || "").trim();
            const digits = raw.replace(/\\D/g, "");
            if (digits.length >= 14) {
              const iso = `${digits.slice(0,4)}-${digits.slice(4,6)}-${digits.slice(6,8)}T${digits.slice(8,10)}:${digits.slice(10,12)}:${digits.slice(12,14)}Z`;
              const dt = new Date(iso);
              if (!Number.isNaN(dt.getTime())) return dt.toISOString();
            }
            const dt = raw ? new Date(raw) : null;
            return dt && !Number.isNaN(dt.getTime()) ? dt.toISOString() : "";
          }

          function parseGdeltArticles(payload, language, query) {
            const articles = Array.isArray(payload?.articles) ? payload.articles : [];
            return articles.slice(0, GDELT_RESULTS_PER_LANGUAGE).map(article => {
              const title = cleanText(article?.title, 500);
              const url = cleanText(article?.url || article?.url_mobile, 1200);
              if (!title || !url) return null;
              return {
                title,
                summary: "",
                source: cleanText(article?.domain || article?.sourcecountry || "GDELT source", 140),
                url,
                published: parseGdeltDate(article?.seendate),
                language,
                query_index: -1,
                query_variant: "gdelt-rescue",
                search_query: query,
                search_engine: "gdelt",
                fallback_locale: false
              };
            }).filter(Boolean);
          }

          async function fetchGdeltWave(language, query, periodDays) {
            try {
              const response = await fetch(gdeltUrl(query, language, periodDays), {
                headers: { "User-Agent": "Mozilla/5.0 CT-Atlas-Deep-Search/5.5" },
                cf: { cacheTtl: 300, cacheEverything: true },
                signal: AbortSignal.timeout(15000)
              });
              if (!response.ok) {
                return { query: { language, query, variant: "gdelt-rescue", engine: "gdelt" }, ok: false, status: response.status, rows: [] };
              }
              const payload = await response.json().catch(() => ({}));
              return {
                query: { language, query, variant: "gdelt-rescue", engine: "gdelt" },
                ok: true,
                status: response.status,
                rows: parseGdeltArticles(payload, language, query)
              };
            } catch (error) {
              return {
                query: { language, query, variant: "gdelt-rescue", engine: "gdelt" },
                ok: false,
                status: 0,
                error: cleanText(error?.message, 180),
                rows: []
              };
            }
          }

          async function retrieveNews(plan, periodDays) {
            const googleWaves = await Promise.all(
              plan.queries.map((item, index) =>
                fetchNewsWave({ ...item, engine: "google_news" }, index, periodDays, LANGUAGE_LOCALES[item.language], false)
              )
            );

            const totals = Object.fromEntries(DEEP_SEARCH_LANGUAGE_CODES.map(code => [code, new Set()]));
            for (const wave of googleWaves) {
              for (const row of wave.rows) totals[wave.query.language].add(row.url);
            }

            const sparseLanguages = DEEP_SEARCH_LANGUAGE_CODES.filter(code => totals[code].size < 3);
            const gdeltWaves = [];
            for (let i = 0; i < sparseLanguages.length; i += 4) {
              const batch = sparseLanguages.slice(i, i + 4);
              const results = await Promise.all(batch.map(code => fetchGdeltWave(code, plan.gdelt_query, periodDays)));
              gdeltWaves.push(...results);
              if (i + 4 < sparseLanguages.length) await new Promise(resolve => setTimeout(resolve, 350));
            }

            const waves = [...googleWaves, ...gdeltWaves];
            return { waves, rows: waves.flatMap(item => item.rows) };
          }'''
          s, n = re.subn(r'async function retrieveNews\(plan, periodDays\) \{.*?\n\}\n\nfunction candidateMapEvents', gdelt_retrieval + '\n\nfunction candidateMapEvents', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('retrieveNews replacement failed')

          s = s.replace(
              'search_query: cleanText(row.search_query, 220),\n    fallback_locale: Boolean(row.fallback_locale),',
              'search_query: cleanText(row.search_query, 280),\n    search_engine: row.search_engine || "google_news",\n    fallback_locale: Boolean(row.fallback_locale),'
          )
          s = s.replace(
              'language: source.language, published: source.published\n    })),',
              'language: source.language, published: source.published,\n      search_engine: source.search_engine || "google_news"\n    })),',
              1
          )

          new_diag = '''function languageDiagnostics(plan, retrieval) {
            const byLanguage = {};
            for (const code of DEEP_SEARCH_LANGUAGE_CODES) {
              byLanguage[code] = {
                code,
                name: LANGUAGE_LOCALES[code]?.label || code,
                query_count: 0,
                article_count: 0,
                successful_queries: 0,
                google_news_articles: 0,
                gdelt_articles: 0
              };
            }
            for (const wave of retrieval.waves) {
              const code = wave.query.language;
              if (!byLanguage[code]) continue;
              byLanguage[code].query_count++;
              byLanguage[code].article_count += wave.rows.length;
              if (wave.ok) byLanguage[code].successful_queries++;
              const engine = wave.query.engine || (wave.query.variant === "gdelt-rescue" ? "gdelt" : "google_news");
              if (engine === "gdelt") byLanguage[code].gdelt_articles += wave.rows.length;
              else byLanguage[code].google_news_articles += wave.rows.length;
            }
            return Object.values(byLanguage);
          }'''
          s, n = re.subn(r'function languageDiagnostics\(plan, retrieval\) \{.*?\n\}\n\nasync function authenticateDeepSearch', new_diag + '\n\nasync function authenticateDeepSearch', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('languageDiagnostics replacement failed')

          s = s.replace(
              'variant: w.query.variant,\n        fallback_locale: Boolean(w.query.fallback_locale),',
              'variant: w.query.variant,\n        engine: w.query.engine || (w.query.variant === "gdelt-rescue" ? "gdelt" : "google_news"),\n        fallback_locale: Boolean(w.query.fallback_locale),'
          )
          s = s.replace(
              'potential_atlas_gaps: gaps\n      },',
              'potential_atlas_gaps: gaps,\n        google_news_articles: retrieval.rows.filter(row => row.search_engine === "google_news").length,\n        gdelt_articles: retrieval.rows.filter(row => row.search_engine === "gdelt").length\n      },'
          )
          path.write_text(s, encoding='utf-8')

          index_path = Path('cloudflare-worker/index.js')
          idx = index_path.read_text(encoding='utf-8').replace('version: "5.3"', 'version: "5.5"')
          index_path.write_text(idx, encoding='utf-8')

          # ---------------- Frontend ----------------
          front = Path('deep-search.js')
          f = front.read_text(encoding='utf-8')
          f = f.replace('PRINT / PDF', 'DOWNLOAD PDF')
          f = f.replace('addEventListener("click",printReport)', 'addEventListener("click",downloadPdf)')
          f = f.replace(
              'Deep Search runs two complementary searches in each of the 12 supported languages, retrieves open-source reporting, clusters duplicate coverage, compares results with CT Atlas and generates a source-cited analytical report. Zero-result language searches are automatically retried through a fallback news edition.',
              'Deep Search runs two native-language Google News searches in each of the 12 supported languages. Languages with sparse results are automatically supplemented through GDELT, then all reporting is merged, deduplicated, compared with CT Atlas and analysed with source citations.'
          )

          old_lang = '''    const count=Number(item.article_count||0);
              const queryCount=Number(item.query_count||0);
              const cls=count>0?" has-results":" no-results";
              return `<div class="deep-language${cls}">
                <span class="deep-language-name">${esc(item.name||item.code||"Language")}</span>
                <strong>${count}</strong>
                <small>${count===1?"article":"articles"} · ${queryCount||1} ${queryCount===1?"query":"queries"}</small>
              </div>`;'''
          new_lang = '''    const count=Number(item.article_count||0);
              const queryCount=Number(item.query_count||0);
              const googleCount=Number(item.google_news_articles||0);
              const gdeltCount=Number(item.gdelt_articles||0);
              const cls=count>0?" has-results":" no-results";
              return `<div class="deep-language${cls}">
                <span class="deep-language-name">${esc(item.name||item.code||"Language")}</span>
                <strong>${count}</strong>
                <small>${count===1?"article":"articles"} · Google ${googleCount} · GDELT ${gdeltCount} · ${queryCount||1} ${queryCount===1?"query":"queries"}</small>
              </div>`;'''
          if old_lang not in f:
              raise SystemExit('language coverage frontend anchor not found')
          f = f.replace(old_lang, new_lang)

          f = f.replace(
              '${esc(fmtDate(item.published))} · ${esc(String(item.language||"").toUpperCase())}${Number(item.source_count||1)>1?',
              '${esc(fmtDate(item.published))} · ${esc(String(item.language||"").toUpperCase())}${item.search_engine?` · ${item.search_engine==="gdelt"?"GDELT":"GOOGLE NEWS"}`:""}${Number(item.source_count||1)>1?'
          )

          pdf_code = r'''let html2pdfLoader=null;
          function loadHtml2Pdf(){
            if(window.html2pdf)return Promise.resolve(window.html2pdf);
            if(html2pdfLoader)return html2pdfLoader;
            html2pdfLoader=new Promise((resolve,reject)=>{
              const script=document.createElement("script");
              script.id="ctAtlasHtml2Pdf";
              script.src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
              script.onload=()=>window.html2pdf?resolve(window.html2pdf):reject(new Error("PDF library did not initialise."));
              script.onerror=()=>reject(new Error("Unable to load the PDF export library."));
              document.head.appendChild(script);
            });
            return html2pdfLoader;
          }

          function pdfSafeName(value){
            return String(value||"Deep-Search").replace(/[^a-z0-9_-]+/gi,"-").replace(/^-+|-+$/g,"").slice(0,70)||"Deep-Search";
          }

          async function downloadPdf(){
            if(!lastPayload)return;
            const button=document.getElementById("deepSearchPrint");
            const original=button?.textContent||"DOWNLOAD PDF";
            if(button){button.disabled=true;button.textContent="BUILDING PDF…";}
            let shell=null;
            try{
              const html2pdf=await loadHtml2Pdf();
              const cited=new Set(lastPayload.grounding?.cited_source_ids||[]);
              const evidence=[...(lastPayload.evidence||[])].sort((a,b)=>(cited.has(b.id)?1:0)-(cited.has(a.id)?1:0));
              const languages=Array.isArray(lastPayload.languages_searched)?lastPayload.languages_searched:[];
              const retrieved=lastPayload.retrieval||{};
              const stamp=new Date(lastPayload.generated_at||Date.now());
              const fileStamp=stamp.toISOString().replace(/[:T]/g,"-").slice(0,16);
              const filename=`CT-Atlas-Deep-Search-${fileStamp}-${pdfSafeName(lastPayload.title)}.pdf`;

              shell=document.createElement("section");
              shell.style.cssText="position:fixed;left:0;top:0;z-index:-9999;width:780px;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;padding:30px;box-sizing:border-box";
              shell.innerHTML=`
                <div style="font-size:11px;letter-spacing:1.5px;color:#6b7280;font-weight:700">CT ATLAS · DEEP SEARCH</div>
                <h1 style="font-size:24px;line-height:1.2;margin:8px 0 10px">${esc(lastPayload.title||"CT Atlas Deep Search")}</h1>
                <div style="font-size:11px;color:#4b5563;margin-bottom:18px"><strong>Question:</strong> ${esc(lastPayload.question||"")}<br><strong>Generated:</strong> ${esc(stamp.toLocaleString("en-GB"))} · <strong>Period:</strong> ${Number(lastPayload.period_days||0)} days · <strong>Model:</strong> ${esc(lastPayload.model||"Gemini")}</div>
                <div style="display:flex;flex-wrap:wrap;gap:7px;margin:0 0 20px">
                  ${[["Articles",retrieved.articles_retrieved],["Unique events",retrieved.unique_event_clusters],["Evidence",retrieved.evidence_events_used_for_analysis],["Atlas matches",retrieved.matched_to_atlas],["Potential gaps",retrieved.potential_atlas_gaps],["Citation coverage",`${Number(lastPayload.grounding?.citation_coverage_percent||0)}%`]].map(([k,v])=>`<div style="border:1px solid #d1d5db;border-radius:6px;padding:7px 10px;min-width:92px"><div style="font-size:9px;color:#6b7280;text-transform:uppercase">${esc(k)}</div><div style="font-size:16px;font-weight:700">${esc(v??0)}</div></div>`).join("")}
                </div>
                <h2 style="font-size:15px;border-bottom:1px solid #d1d5db;padding-bottom:5px;margin:24px 0 10px">SEARCH COVERAGE</h2>
                <div style="display:flex;flex-wrap:wrap;gap:5px">${languages.map(item=>`<div style="border:1px solid #d1d5db;border-radius:5px;padding:5px 7px;font-size:10px"><strong>${esc(item.name||item.code)}</strong> · ${Number(item.article_count||0)} articles · Google ${Number(item.google_news_articles||0)} · GDELT ${Number(item.gdelt_articles||0)}</div>`).join("")}</div>
                <h2 style="font-size:15px;border-bottom:1px solid #d1d5db;padding-bottom:5px;margin:26px 0 10px">ANALYTICAL REPORT</h2>
                <div style="font-size:12px">${formatAnalysis(lastPayload.analysis||"")}</div>
                <h2 style="font-size:15px;border-bottom:1px solid #d1d5db;padding-bottom:5px;margin:28px 0 10px">EVIDENCE PACK</h2>
                ${evidence.map(item=>`<div class="pdf-source" style="border-top:1px solid #e5e7eb;padding:9px 0;page-break-inside:avoid"><div style="font-weight:700">${esc(item.id)} · ${esc(item.source||"Source")}${cited.has(item.id)?" · CITED":""}</div><div style="font-size:12px;margin:2px 0">${esc(item.title||"")}</div><div style="font-size:10px;color:#6b7280">${esc(fmtDate(item.published))} · ${esc(String(item.language||"").toUpperCase())} · ${item.search_engine==="gdelt"?"GDELT":"Google News"}</div>${item.url?`<div style="font-size:9px;word-break:break-all;color:#1d4ed8">${esc(item.url)}</div>`:""}</div>`).join("")}
                <div style="margin-top:24px;border-top:1px solid #d1d5db;padding-top:9px;font-size:9px;color:#6b7280">This analytical tool is an independent OSINT prototype created for research and analytical purposes. The information displayed is derived from open sources and automated AI-assisted processing. It should not be considered verified intelligence and must be independently validated before any operational or decision-making use.</div>`;
              document.body.appendChild(shell);

              await html2pdf().set({
                margin:[10,10,12,10],
                filename,
                image:{type:"jpeg",quality:0.98},
                html2canvas:{scale:2,useCORS:true,logging:false,backgroundColor:"#ffffff"},
                jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
                pagebreak:{mode:["css","legacy"],avoid:[".pdf-source"]},
                enableLinks:true
              }).from(shell).save();
              setStatus("PDF downloaded successfully.","success");
            }catch(error){
              setStatus(error?.message||"PDF download failed.","error");
            }finally{
              if(shell) shell.remove();
              if(button){button.disabled=false;button.textContent=original;}
            }
          }
          '''
          f, n = re.subn(r'function printReport\(\)\{.*?\n\}\n\ndocument\.addEventListener', pdf_code + '\n          document.addEventListener', f, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('printReport replacement failed')

          front.write_text(f, encoding='utf-8')

      - name: Validate JavaScript
        run: |
          node --check cloudflare-worker/deep-search.js
          node --check cloudflare-worker/index.js
          node --check deep-search.js
          grep -q 'deep-search-v5.5-dual-engine-gdelt' cloudflare-worker/deep-search.js
          grep -q 'GDELT_DOC_URL' cloudflare-worker/deep-search.js
          grep -q 'DOWNLOAD PDF' deep-search.js
          grep -q 'html2pdf.bundle.min.js' deep-search.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker/deep-search.js cloudflare-worker/index.js deep-search.js
          git diff --cached --quiet || git commit -m "Add GDELT multilingual rescue and PDF download"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
