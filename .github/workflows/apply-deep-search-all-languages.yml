name: Apply Deep Search all-language mode

on:
  push:
    branches:
      - main
    paths:
      - "tools/apply_deep_search_all_languages.py"
      - ".github/workflows/apply-deep-search-all-languages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ct-deep-search-language-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply mandatory 12-language Deep Search mode
        run: python tools/apply_deep_search_all_languages.py

      - name: Validate Deep Search backend
        run: node --check cloudflare-worker/deep-search.js

      - name: Commit upgraded backend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CT Atlas Upgrade Bot"
          git config user.email "actions@github.com"
          git add cloudflare-worker/deep-search.js
          if git diff --cached --quiet; then
            echo "No Deep Search backend changes to commit."
          else
            git commit -m "Search all 12 CT Atlas languages in Deep Search"
            git push origin HEAD:main
          fi
