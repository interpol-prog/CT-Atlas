name: Finalize Deep Search v5.5 UI text

on:
  push:
    paths:
      - '.github/workflows/finalize-deep-search-v55-ui.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Update explanatory text
        shell: python
        run: |
          from pathlib import Path
          p=Path('deep-search.js')
          s=p.read_text(encoding='utf-8')
          old='Deep Search runs two complementary searches in each of the 12 supported languages, retrieves open-source reporting, clusters duplicate coverage, compares results with CT Atlas and generates a source-cited analytical report. Languages returning fewer than three distinct articles are retried with a shorter, broader query through a fallback news edition. Coverage is limited to Google News and the selected period.'
          new='Deep Search runs two native-language Google News searches in each of the 12 supported languages. Languages with sparse results are automatically supplemented through GDELT; all reporting is then merged, deduplicated, compared with CT Atlas and analysed with source citations.'
          if old not in s:
              raise SystemExit('Expected Deep Search method text not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
      - name: Validate
        run: |
          node --check deep-search.js
          grep -q 'supplemented through GDELT' deep-search.js
          grep -q 'DOWNLOAD PDF' deep-search.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deep-search.js
          git commit -m "Finalize Deep Search v5.5 UI text"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
