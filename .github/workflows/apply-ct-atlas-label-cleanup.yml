name: Apply CT Atlas label cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-ct-atlas-label-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ct-atlas-label-cleanup
  cancel-in-progress: false

jobs:
  update-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Update CT Atlas labels and disclaimer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_disclaimer = (
              "This analytical tool is an independent staff-developed OSINT prototype created for research and analytical purposes. "
              "It does not constitute an official INTERPOL product, publication, position or assessment. "
              "The information displayed is derived from open sources and automated AI-assisted processing. "
              "It should not be considered verified intelligence and must be independently validated before any operational or decision-making use."
          )
          new_disclaimer = (
              "This analytical tool is an independent OSINT prototype created for research and analytical purposes. "
              "The information displayed is derived from open sources and automated AI-assisted processing. "
              "It should not be considered verified intelligence and must be independently validated before any operational or decision-making use."
          )

          replacements = [
              ('>INTERPOL OFFICES<', '>OUR OFFICES<'),
              ('CT Intelligence Map infrastructure', 'CT Atlas Infrastructure'),
              ('CT Intelligence Map', 'CT Atlas'),
              ('<optgroup label="INTERPOL REGIONS">', '<optgroup label="OFFICIAL REGIONS">'),
              ('<optgroup label="INTERPOL MEMBER COUNTRIES">', '<optgroup label="MEMBER COUNTRIES">'),
              (old_disclaimer, new_disclaimer),
          ]

          missing = [old for old, _ in replacements if old not in text]
          if missing:
              raise SystemExit("Expected text not found: " + repr(missing))

          for old, new in replacements:
              text = text.replace(old, new)

          # Preserve the repository's CRLF convention.
          normalized = text.replace("\r\n", "\n").replace("\r", "\n")
          path.write_bytes(normalized.replace("\n", "\r\n").encode("utf-8"))

          checks = [
              "OUR OFFICES",
              "CT Atlas Infrastructure",
              '<div id="disclaimerSubtitle">CT Atlas</div>',
              'OFFICIAL REGIONS',
              'MEMBER COUNTRIES',
              new_disclaimer,
          ]
          final = path.read_text(encoding="utf-8")
          for value in checks:
              if value not in final:
                  raise SystemExit("Post-change validation failed: " + value)

          # Explicitly preserve the List / Export filename requested by the user.
          if 'INTERPOL_CT_events_' not in final:
              raise SystemExit("List / Export filename changed unexpectedly.")
          PY

      - name: Commit UI text cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CT Atlas UI Bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Remove INTERPOL UI wording and rename CT Atlas labels"
            git push origin HEAD:main
          fi
